<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05050a">
<title>Galaxy — Jogo de Nave</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207;color:#fff;font-family:Arial,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:min(100vw,66.67vh);height:min(100vh,150vw);max-width:600px;max-height:900px;background:#03030a;overflow:hidden;border:1px solid #1b1a2b}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 2px 6px #000;font-size:16px;pointer-events:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#020207c9;padding:24px}.panel{max-width:340px}.panel h1{font-size:clamp(36px,9vw,56px);margin:0 0 10px;color:#79e7ff;text-shadow:0 0 18px #139cff}.panel p{line-height:1.5;color:#e3e3f0}.btn{border:0;border-radius:10px;padding:14px 28px;background:linear-gradient(135deg,#168bea,#5c52dd);color:white;font-size:18px;font-weight:bold;cursor:pointer}.hint{font-size:13px!important;color:#b9b8ca!important}.hidden{display:none}
</style>
</head>
<body>
<main id="game">
<canvas id="c" aria-label="Jogo Galaxy"></canvas>
<div class="hud"><span>PONTOS: <b id="score">0</b></span><span>VIDAS: <b id="lives">3</b></span></div>
<div id="overlay" class="overlay"><div class="panel"><h1>GALAXY</h1><p>Enfrente a invasão alienígena e defenda a galáxia!</p><button id="start" class="btn">JOGAR</button><p class="hint">A nave atira sozinha.<br>Arraste-a para os lados no celular ou use as setas no computador.</p></div></div>
</main>
<script>
(()=>{
const W=300,H=450,canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
canvas.width=W;canvas.height=H;
let ship,shots=[],enemyShots=[],aliens=[],stars=[],score=0,lives=3,running=false,last=0,shotTimer=0,enemyTimer=0,formationX=0,formationDir=1,formationY=0,keys={},pointer=null,raf=0,hitFlash=0;
const alienPattern=["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10100000101","00011011000"];
const shipPattern=["00000100000","00001110000","00011111000","00111111100","01111111110","11100100111","11000100011"];
const palette=["#ff3838","#ff8a24","#ffe33d","#38e445","#ef35ff"];
function makeStars(){stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.12?2:1,bright:Math.random()<.18,phase:Math.random()*6.28,trail:Math.random()<.12}))}
function reset(){score=0;lives=3;shots=[];enemyShots=[];aliens=[];formationX=0;formationY=0;formationDir=1;ship={x:W/2,y:H-44,r:15,cool:0,inv:0};scoreEl.textContent=score;livesEl.textContent=lives;for(let row=0;row<5;row++)for(let col=0;col<8;col++)aliens.push({row,col,alive:true});shotTimer=.15;enemyTimer=.8;last=performance.now()}
function pixelSprite(pattern,x,y,pixel,color,glow=0){ctx.save();ctx.fillStyle=color;if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow}for(let r=0;r<pattern.length;r++)for(let c=0;c<pattern[r].length;c++)if(pattern[r][c]==="1")ctx.fillRect(Math.round(x+c*pixel),Math.round(y+r*pixel),pixel,pixel);ctx.restore()}
function draw(now=performance.now()){
ctx.clearRect(0,0,W,H);ctx.fillStyle="#03030a";ctx.fillRect(0,0,W,H);
for(const s of stars){const shimmer=s.bright?.35+.65*(.5+.5*Math.sin(now*.004+s.phase)):.35+.35*(.5+.5*Math.sin(now*.002+s.phase));ctx.globalAlpha=shimmer;ctx.fillStyle=s.bright?"#fff4c7":"#b9c6e6";if(s.trail&&s.bright){ctx.save();ctx.shadowColor="#fff1a8";ctx.shadowBlur=5;ctx.fillRect(s.x-5,s.y+2,5,1);ctx.fillRect(s.x,s.y,s.s,s.s);ctx.restore()}else{ctx.fillRect(s.x,s.y,s.s,s.s);if(s.bright){ctx.fillRect(s.x-2,s.y,s.s+4,1);ctx.fillRect(s.x,s.y-2,1,s.s+4)}}}ctx.globalAlpha=1;
for(const a of aliens)if(a.alive){const x=28+a.col*31+formationX,y=52+a.row*27+formationY;pixelSprite(alienPattern,x,y,2,palette[a.row],4)}
for(const b of shots){ctx.save();ctx.shadowColor="#ffe84a";ctx.shadowBlur=10;ctx.fillStyle="#fff75a";ctx.fillRect(Math.round(b.x-1),Math.round(b.y-9),3,12);ctx.restore()}
for(const b of enemyShots){ctx.save();ctx.shadowColor="#ff3b52";ctx.shadowBlur=8;ctx.fillStyle="#ff616a";ctx.fillRect(Math.round(b.x-1),Math.round(b.y-4),3,8);ctx.restore()}
if(ship&&(!ship.inv||Math.floor(now/80)%2===0)){pixelSprite(shipPattern,Math.round(ship.x-11),Math.round(ship.y-14),2,"#22b8ff",7);ctx.fillStyle="#ff293e";ctx.shadowColor="#ff2438";ctx.shadowBlur=5;ctx.fillRect(Math.round(ship.x-16),Math.round(ship.y-4),4,15);ctx.fillRect(Math.round(ship.x+12),Math.round(ship.y-4),4,15);ctx.shadowBlur=0;if(hitFlash>0){ctx.globalAlpha=.45;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}
}
function fire(){if(ship)shots.push({x:ship.x,y:ship.y-15,v:300})}
function finish(){running=false;overlay.classList.remove("hidden");overlay.querySelector("h1").textContent="FIM DE JOGO";overlay.querySelector("p").textContent="Você fez "+score+" pontos. Tente novamente!";document.getElementById("start").textContent="JOGAR DE NOVO"}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;
const dir=(keys.ArrowLeft||keys.a||keys.A?-1:0)+(keys.ArrowRight||keys.d||keys.D?1:0);ship.x=Math.max(18,Math.min(W-18,ship.x+dir*220*dt));
shotTimer-=dt;if(shotTimer<=0){fire();shotTimer=.3}
enemyTimer-=dt;if(enemyTimer<=0){const live=aliens.filter(a=>a.alive);if(live.length){const a=live[Math.floor(Math.random()*live.length)];enemyShots.push({x:28+a.col*31+formationX+11,y:52+a.row*27+formationY+18,v:125})}enemyTimer=Math.max(.4,.95-liveCount()/80)}
const left=aliens.some(a=>a.alive&&28+a.col*31+formationX<12),right=aliens.some(a=>a.alive&&28+a.col*31+formationX+22>W-12);formationX+=formationDir*26*dt;if(left&&formationDir<0||right&&formationDir>0){formationDir*=-1;formationY+=7}
for(const b of shots)b.y-=b.v*dt;shots=shots.filter(b=>b.y>-12);for(const b of enemyShots)b.y+=b.v*dt;enemyShots=enemyShots.filter(b=>b.y<H+12);
for(const b of shots){for(const a of aliens){if(!a.alive)continue;const ax=28+a.col*31+formationX,ay=52+a.row*27+formationY;if(b.x>=ax-1&&b.x<=ax+23&&b.y>=ay&&b.y<=ay+18){a.alive=false;b.y=-100;score+=10;scoreEl.textContent=score;break}}}
for(const b of enemyShots)if(ship&&Math.abs(b.x-ship.x)<15&&Math.abs(b.y-ship.y)<17&&ship.inv<=0){b.y=H+50;lives--;livesEl.textContent=lives;ship.inv=1.1;hitFlash=.16;if(lives<=0){draw(now);finish();return}}
if(aliens.some(a=>a.alive&&52+a.row*27+formationY>ship.y-24)){lives=0;livesEl.textContent=lives;draw(now);finish();return}
if(ship.inv>0)ship.inv-=dt;if(hitFlash>0)hitFlash-=dt;
if(!aliens.some(a=>a.alive)){for(const a of aliens)a.alive=true;formationY=0;formationX=0}
draw(now);raf=requestAnimationFrame(loop)
}
function liveCount(){let n=0;for(const a of aliens)if(a.alive)n++;return n}
document.getElementById("start").addEventListener("click",()=>{overlay.querySelector("h1").textContent="GALAXY";overlay.querySelector("p").textContent="Enfrente a invasão alienígena e defenda a galáxia!";overlay.classList.add("hidden");reset();running=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)});
window.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault()});window.addEventListener("keyup",e=>keys[e.key]=false);
function point(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
canvas.addEventListener("pointerdown",ev=>{if(!running)return;ev.preventDefault();const p=point(ev);pointer={id:ev.pointerId,startX:p.x,startY:p.y,x:p.x,y:p.y,near:Math.hypot(p.x-ship.x,p.y-ship.y)<34,dragged:false,offset:ship.x-p.x};if(pointer.near)canvas.setPointerCapture(ev.pointerId)});
canvas.addEventListener("pointermove",ev=>{if(!pointer||pointer.id!==ev.pointerId)return;const p=point(ev);if(Math.hypot(p.x-pointer.startX,p.y-pointer.startY)>5)pointer.dragged=true;if(pointer.near&&pointer.dragged)ship.x=Math.max(18,Math.min(W-18,p.x+pointer.offset))});
function endPointer(ev){if(pointer&&pointer.id===ev.pointerId)pointer=null}
canvas.addEventListener("pointerup",endPointer);canvas.addEventListener("pointercancel",endPointer);makeStars();draw();
})();
</script>
</body>
</html>
