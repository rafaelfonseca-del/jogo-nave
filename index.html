<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Galaxy — Jogo de Nave</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#fff;font-family:Arial,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-width:520px;max-height:920px;background:radial-gradient(ellipse at 50% 80%,#102c53 0,#081327 45%,#030711 100%);overflow:hidden;border:1px solid #18345a}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 2px 5px #000;font-size:16px;pointer-events:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#020611b8;padding:24px}.panel{max-width:340px}.panel h1{font-size:clamp(34px,9vw,52px);margin:0 0 10px;color:#7ee7ff;text-shadow:0 0 20px #139cff}.panel p{line-height:1.5;color:#d7e9ff}.btn{border:0;border-radius:12px;padding:14px 28px;background:linear-gradient(135deg,#16b9ff,#6555ff);color:white;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 6px 22px #008dff55}.hint{font-size:13px!important;color:#a9bfdc!important}.hidden{display:none}.mobile-controls{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.control{pointer-events:auto;width:66px;height:66px;border-radius:50%;border:1px solid #9feaff99;background:#17345c99;color:#fff;font-size:28px;user-select:none}.fire{width:76px;height:76px;background:#a32b42bb;border-color:#ffb2c0}.movegroup{display:flex;gap:12px}
</style>
</head>
<body><main id="game"><canvas id="c"></canvas><div class="hud"><span>PONTOS: <b id="score">0</b></span><span>VIDAS: <b id="lives">3</b></span></div><div id="overlay" class="overlay"><div class="panel"><h1>GALAXY</h1><p>Defenda a galáxia! Desvie dos inimigos e atire para marcar pontos.</p><button id="start" class="btn">JOGAR</button><p class="hint">No computador: setas ou A/D para mover e espaço para atirar.<br>No celular: use os botões na tela.</p></div></div><div class="mobile-controls"><div class="movegroup"><button class="control" id="left" aria-label="Mover para a esquerda">◀</button><button class="control" id="right" aria-label="Mover para a direita">▶</button></div><button class="control fire" id="shoot" aria-label="Atirar">●</button></div></main>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
let w=0,h=0,ship,bullets=[],enemies=[],stars=[],score=0,lives=3,running=false,last=0,spawn=0,keys={},touch={left:false,right:false,shoot:false},raf=0;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.8+.3,v:Math.random()*35+10}));if(ship)ship.y=h-105;draw()}
function reset(){score=0;lives=3;bullets=[];enemies=[];ship={x:w/2,y:h-105,r:16,speed:280,cool:0,inv:0};scoreEl.textContent=score;livesEl.textContent=lives;spawn=0;last=performance.now()}
function shipDraw(){ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowColor='#44dfff';ctx.shadowBlur=16;ctx.fillStyle='#64e9ff';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(15,16);ctx.lineTo(0,9);ctx.lineTo(-15,16);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(5,8);ctx.lineTo(-5,8);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.35+Math.random()*.45;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;for(const b of bullets){ctx.shadowColor='#60f6ff';ctx.shadowBlur=12;ctx.fillStyle='#b3fbff';ctx.fillRect(b.x-2,b.y-9,4,13)}ctx.shadowBlur=0;for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.shadowColor='#ff4777';ctx.shadowBlur=14;ctx.fillStyle='#ff416d';ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-15,-11);ctx.lineTo(0,-6);ctx.lineTo(15,-11);ctx.closePath();ctx.fill();ctx.restore()}if(ship&&(!ship.inv||Math.floor(performance.now()/100)%2===0))shipDraw()}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function end(){running=false;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent='FIM DE JOGO';overlay.querySelector('p').textContent='Você fez '+score+' pontos. Tente novamente!';document.getElementById('start').textContent='JOGAR DE NOVO'}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.035);last=now;for(const s of stars){s.y+=s.v*dt;if(s.y>h){s.y=0;s.x=Math.random()*w}}const dir=(keys.ArrowLeft||keys.a||touch.left?-1:0)+(keys.ArrowRight||keys.d||touch.right?1:0);ship.x=Math.max(22,Math.min(w-22,ship.x+dir*ship.speed*dt));ship.cool-=dt;if((keys[' ']||touch.shoot)&&ship.cool<=0){bullets.push({x:ship.x,y:ship.y-18,r:4,v:490});ship.cool=.22}for(const b of bullets)b.y-=b.v*dt;bullets=bullets.filter(b=>b.y>-20);spawn-=dt;if(spawn<=0){enemies.push({x:24+Math.random()*(w-48),y:-20,r:15,v:95+Math.random()*65});spawn=Math.max(.35,1.05-score/900)}for(const e of enemies)e.y+=e.v*dt;for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];let destroyed=false;for(let j=bullets.length-1;j>=0;j--)if(hit(e,bullets[j])){enemies.splice(i,1);bullets.splice(j,1);score+=10;scoreEl.textContent=score;destroyed=true;break}if(!destroyed&&e.y>h+15){enemies.splice(i,1);lives--;livesEl.textContent=lives;if(lives<=0){draw();end();return}}}draw();raf=requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',()=>{overlay.querySelector('h1').textContent='GALAXY';overlay.classList.add('hidden');reset();running=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)});
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);function bind(id,k){const el=document.getElementById(id);const on=e=>{e.preventDefault();touch[k]=true;el.setPointerCapture?.(e.pointerId)},off=e=>{e.preventDefault();touch[k]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}bind('left','left');bind('right','right');bind('shoot','shoot');window.addEventListener('resize',resize);resize();
})();
</script></body></html>
